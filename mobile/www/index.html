<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WSD WMS</title>
<style>
  :root{--brand:#2f6df6;--brand2:#1e51d6;--bg:#0f1830;--panel:#16213f;--panel2:#1e2c52;--text:#eef2fb;--muted:#9fb0d0;--border:#2b3a63;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  #app{min-height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header .back{font-size:22px;background:none;border:none;color:var(--text);padding:2px 6px}
  header h1{font-size:17px;margin:0;flex:1}
  header .who{font-size:11px;color:var(--muted);text-align:right;line-height:1.2}
  main{flex:1;padding:16px;overflow:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 14px;text-align:center;font-weight:700;font-size:16px}
  .tile .ic{font-size:34px;display:block;margin-bottom:8px}
  .tile:active{background:var(--panel2)}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
  input,select{width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .scanbox{border:2px dashed var(--brand);border-radius:14px;padding:6px;background:rgba(47,109,246,.08)}
  button.big{width:100%;font-size:18px;font-weight:800;padding:16px;border:none;border-radius:14px;background:var(--brand);color:#fff;margin-top:16px}
  button.big:active{background:var(--brand2)}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  button.cam{width:100%;font-size:15px;font-weight:700;padding:12px;border:none;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);margin-top:8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
  .muted{color:var(--muted)} .center{text-align:center}
  .row{display:flex;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.good{background:rgba(34,197,94,.18);color:var(--good)} .pill.bad{background:rgba(239,68,68,.18);color:var(--bad)}
  .big-num{font-size:30px;font-weight:800}
  .logo{height:40px;display:block;margin:0 auto 10px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111a33;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;max-width:90%;text-align:center;display:none}
  #cam{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
  #cam video{flex:1;width:100%;object-fit:cover}
  #cam .bar{padding:14px;background:#000;text-align:center}
  .login-wrap{max-width:360px;margin:8vh auto 0}
  .op-hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="cam"><video id="camvid" playsinline></video><div class="bar"><button class="big ghost" onclick="closeCam()">Închide camera</button></div></div>

<script>
/* ====== Config ====== */
var API = "https://wms.catalincherciu90.workers.dev"; // adresa serverului WMS
var token = localStorage.getItem("wms_m_token") || "";
var me = null;
var LOCS = [];        // cache locații
var scanTarget = null; // funcție care primește codul scanat pe ecranul curent

/* ====== Utilitare ====== */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function toast(m,bad){ var t=el("toast"); t.textContent=m; t.style.background=bad?"#7f1d1d":"#111a33"; t.style.display="block"; clearTimeout(window._tt); window._tt=setTimeout(function(){t.style.display="none";},2600); }
/* Feedback la scanare: sunet (beep) + vibrație. ok=true → scurt/înalt; ok=false → grav/dublu. */
function feedback(ok){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var ctx=window._ac||(window._ac=new AC()); if(ctx.state==="suspended") ctx.resume();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="square"; o.frequency.value=ok?920:200; g.gain.value=0.06;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(function(){ try{o.stop();}catch(e){} }, ok?90:220);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?55:[70,60,70]); }catch(e){}
}
/* Alertă „comandă nouă": chime ascendent (3 note) + vibrație puternică. Distinct de beep-ul de scan. */
function newOrderChime(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var ctx=window._ac||(window._ac=new AC()); if(ctx.state==="suspended") ctx.resume();
    var notes=[784,988,1319]; // Sol–Si–Mi ascendent
    for(var i=0;i<notes.length;i++){
      var t0=ctx.currentTime+i*0.17;
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=notes[i];
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.14,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+0.18);
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]); }catch(e){}
}
/* Deblochează audio după un gest (login) — ca sunetul să meargă și când alerta vine din poll. */
function primeAudio(){ try{ var AC=window.AudioContext||window.webkitAudioContext; window._ac=window._ac||new AC(); if(window._ac.state==="suspended") window._ac.resume(); }catch(e){} }

/* Verificare periodică: alertă când apare o comandă nouă de livrare (ex. plasată de client din portal). */
var _lastOrderId = Number(localStorage.getItem("wms_m_lastorder")||0) || 0;
function ordPollTick(){
  if(!token || !me || me.kind==="client") return;
  api("GET","/api/orders?type=outbound").then(function(d){
    var orders=(d.orders||[]); if(!orders.length) return;
    var maxId=orders.reduce(function(m,o){ return Math.max(m, Number(o.id)||0); }, 0);
    if(_lastOrderId===0){ _lastOrderId=maxId; localStorage.setItem("wms_m_lastorder",String(maxId)); return; } // prima rulare = referință, fără alertă
    var fresh=orders.filter(function(o){ return Number(o.id)>_lastOrderId && o.status!=="completed" && o.status!=="cancelled"; });
    if(fresh.length){
      _lastOrderId=maxId; localStorage.setItem("wms_m_lastorder",String(maxId));
      newOrderChime();
      toast(fresh.length===1 ? ("Comandă nouă: "+esc(fresh[0].code)) : (fresh.length+" comenzi noi de pregătit"));
      if(el("ord_list")) screenOrders(); // dacă suntem pe lista de comenzi, o reîmprospătăm
    } else if(maxId>_lastOrderId){ _lastOrderId=maxId; localStorage.setItem("wms_m_lastorder",String(maxId)); }
  }).catch(function(){});
}
function startOrdPoll(){ stopOrdPoll(); ordPollTick(); window._ordPoll=setInterval(ordPollTick, 20000); }
function stopOrdPoll(){ if(window._ordPoll){ clearInterval(window._ordPoll); window._ordPoll=null; } }
function api(method,path,body){
  var o={method:method,headers:{}};
  if(token) o.headers["Authorization"]="Bearer "+token;
  if(body){ o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(body); }
  return fetch(API+path,o).then(function(r){
    if(r.status===401){ logout(); throw new Error("Sesiune expirată"); }
    return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||("Eroare "+r.status)); return d; });
  });
}
function logout(){ stopOrdPoll(); token=""; me=null; localStorage.removeItem("wms_m_token"); renderLogin(); }

/* ====== Ecrane ====== */
function shell(title, body, opts){
  opts=opts||{};
  var back = opts.back ? '<button class="back" onclick="'+opts.back+'">‹</button>' : '';
  var who = me ? '<div class="who">'+esc(me.name||"")+'<br>'+esc(me.role||"")+'</div>' : '';
  el("app").innerHTML =
    '<header>'+back+'<h1>'+esc(title)+'</h1>'+who+'</header><main>'+body+'</main>';
}

function renderLogin(){
  el("app").innerHTML='<main><div class="login-wrap">'
    +'<img class="logo" src="logo.png" alt="WSD" onerror="this.style.display=\'none\'">'
    +'<div class="center" style="font-size:22px;font-weight:800;margin-bottom:2px">WSD <span style="opacity:.7;font-weight:600">WMS</span></div>'
    +'<div class="center muted" style="margin-bottom:18px">Autentificare operator</div>'
    +'<label>Email</label><input id="l_email" type="email" autocomplete="username">'
    +'<label>Parolă</label><input id="l_pass" type="password" autocomplete="current-password">'
    +'<div id="l_msg" class="center" style="color:var(--bad);font-size:14px;margin-top:10px"></div>'
    +'<button class="big" onclick="doLogin()">Intră în cont</button>'
    +'</div></main>';
}
function doLogin(){
  var email=el("l_email").value.trim(), pass=el("l_pass").value;
  if(!email||!pass){ el("l_msg").textContent="Completează email și parolă"; return; }
  api("POST","/api/auth/login",{email:email,password:pass}).then(function(d){
    if(d.user && (d.user.kind==="client")){ el("l_msg").textContent="Acest cont e de client, nu de operator."; return; }
    token=d.token; me=d.user; localStorage.setItem("wms_m_token",token); primeAudio(); loadLocs(); renderHome(); startOrdPoll();
  }).catch(function(e){ el("l_msg").textContent=e.message; });
}

function loadLocs(){ api("GET","/api/locations").then(function(d){ LOCS=(d.locations||[]).filter(function(l){return l.active!==0;}); }).catch(function(){}); }

function renderHome(){
  scanTarget=function(code){ opLookup(code); };
  shell("WSD WMS",
    '<div class="grid">'
    +tile("orders","📋","Comenzi<br>de pregătit")
    +tile("lookup","🔎","Scanează<br>& caută")
    +tile("receive","📥","Recepție")
    +tile("ship","📤","Expediere")
    +tile("transfer","🔄","Transfer")
    +tile("inventory","🧮","Inventar")
    +'</div>'
    +'<button class="big ghost" style="margin-top:22px" onclick="logout()">Ieșire</button>'
    +'<div class="op-hint center" style="margin-top:10px">Scanează oricând cu laserul Zebra — te duce direct la produs.</div>');
}
function tile(op,ic,label){ return '<div class="tile" onclick="startOp(\''+op+'\')"><span class="ic">'+ic+'</span>'+label+'</div>'; }

window.startOp=function(op){ if(op==="lookup") screenLookup(); else if(op==="receive") screenMove("receive"); else if(op==="ship") screenMove("ship"); else if(op==="transfer") screenTransfer(); else if(op==="orders") screenOrders(); else if(op==="inventory") screenInventory(); };

/* ---- Scanare & caută ---- */
function screenLookup(){
  scanTarget=function(code){ el("s_scan").value=code; opLookup(code); };
  shell("Scanează & caută",
    '<div class="scanbox"><input id="s_scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează codul (fără Enter)"></div>'
    +'<button class="cam" onclick="openCam(function(c){el(\'s_scan\').value=c;opLookup(c)})">📷 Scanează cu camera</button>'
    +'<div id="s_res"></div>', {back:"renderHome()"});
  wireScan("s_scan", opLookup);
}
function opLookup(code){
  code=(code||"").trim(); if(!code) return;
  resolveProduct(code).then(function(p){
    if(!p){ feedback(false); el("s_res") && (el("s_res").innerHTML='<div class="card center muted">Produs negăsit pentru: '+esc(code)+'</div>'); return; }
    feedback(true);
    return api("GET","/api/inventory/stock?product_id="+p.id).then(function(d){
      var rows=(d.stock||[]).map(function(s){return '<tr><td>'+esc(s.location_code)+'</td><td class="center"><b>'+esc(s.quantity)+'</b> '+esc(s.unit||"")+'</td></tr>';}).join("");
      var total=(d.stock||[]).reduce(function(a,s){return a+Number(s.quantity||0);},0);
      var host=el("s_res"); if(!host){ screenLookup(); host=el("s_res"); }
      host.innerHTML='<div class="card"><div class="muted" style="font-size:12px">'+esc(p.barcode||p.sku||"")+'</div>'
        +'<div style="font-size:18px;font-weight:800;margin:2px 0 8px">'+esc(p.name)+'</div>'
        +'<div class="big-num">'+total+' <span style="font-size:15px" class="muted">'+esc(p.unit||"buc")+' total</span></div>'
        +'<table style="margin-top:10px"><thead><tr><th>Locație</th><th class="center">Cant.</th></tr></thead><tbody>'+(rows||'<tr><td colspan=2 class="center muted">Fără stoc</td></tr>')+'</tbody></table></div>';
    });
  }).catch(function(e){ toast(e.message,true); });
}

/* ---- Recepție / Expediere ---- */
function screenMove(kind){
  var title = kind==="receive" ? "Recepție (intrare)" : "Expediere (ieșire)";
  window._mv={kind:kind, product:null};
  scanTarget=function(code){ mvScan(code); };
  shell(title,
    '<div class="scanbox"><input id="m_scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează produsul (fără Enter)"></div>'
    +'<button class="cam" onclick="openCam(function(c){el(\'m_scan\').value=c;mvScan(c)})">📷 Scanează cu camera</button>'
    +'<div id="m_prod"></div>'
    +'<div id="m_form" style="display:none">'
    +'<label>Locație</label><select id="m_loc">'+locOptions()+'</select>'
    +'<label>Cantitate</label><input id="m_qty" type="number" inputmode="numeric" min="1" value="1">'
    +'<button class="big" onclick="mvSubmit()">'+(kind==="receive"?"Confirmă recepția":"Confirmă expedierea")+'</button>'
    +'</div>', {back:"renderHome()"});
  wireScan("m_scan", mvScan);
}
function mvScan(code){
  code=(code||"").trim(); if(!code) return;
  resolveProduct(code).then(function(p){
    if(!p){
      feedback(false);
      if(window._mv && window._mv.kind==="receive"){ mvNewProduct(code); }
      else { el("m_prod").innerHTML='<div class="card center muted">Produs negăsit: '+esc(code)+'</div>'; el("m_form").style.display="none"; }
      return;
    }
    feedback(true);
    window._mv.product=p;
    el("m_prod").innerHTML='<div class="card"><div class="muted" style="font-size:12px">'+esc(p.barcode||p.sku||"")+'</div><div style="font-size:17px;font-weight:800">'+esc(p.name)+'</div></div>';
    el("m_form").style.display="block";
    el("m_qty").focus(); el("m_qty").select();
  }).catch(function(e){ toast(e.message,true); });
}
function mvNewProduct(code){
  window._mv.newcode=code;
  if(el("m_form")) el("m_form").style.display="none";
  el("m_prod").innerHTML='<div class="card">'
    +'<div style="font-weight:800;margin-bottom:4px">Produs nou</div>'
    +'<div class="muted" style="font-size:12px;margin-bottom:8px">Cod: '+esc(code)+' — negăsit în sistem. Adaugă-l:</div>'
    +'<label>Nume produs</label><input id="np_name" placeholder="Denumire produs" autocomplete="off">'
    +'<label>Client (opțional)</label><select id="np_client"><option value="">— intern (al companiei) —</option></select>'
    +'<label>UM</label><input id="np_unit" value="buc">'
    +'<button class="big" onclick="mvCreateProduct()">Creează și continuă recepția</button></div>';
  api("GET","/api/clients").then(function(d){ if(el("np_client")) el("np_client").innerHTML='<option value="">— intern (al companiei) —</option>'+(d.clients||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join(""); }).catch(function(){});
  setTimeout(function(){ if(el("np_name")) el("np_name").focus(); },120);
}
window.mvCreateProduct=function(){
  var name=el("np_name")?el("np_name").value.trim():"";
  if(!name){ toast("Scrie numele produsului",true); return; }
  var body={ barcode:window._mv.newcode, name:name,
    unit:(el("np_unit")&&el("np_unit").value.trim())||"buc",
    client_id:(el("np_client")&&el("np_client").value)?Number(el("np_client").value):null };
  api("POST","/api/products",body).then(function(d){
    feedback(true); toast("Produs creat: "+d.product.name);
    window._mv.product=d.product;
    el("m_prod").innerHTML='<div class="card"><div class="muted" style="font-size:12px">'+esc(d.product.barcode||d.product.sku||"")+'</div><div style="font-size:17px;font-weight:800">'+esc(d.product.name)+'</div></div>';
    el("m_form").style.display="block";
    if(el("m_qty")){ el("m_qty").focus(); el("m_qty").select(); }
  }).catch(function(e){ toast(e.message,true); });
};
function mvSubmit(){
  var mv=window._mv; if(!mv||!mv.product){ toast("Scanează întâi un produs",true); return; }
  var loc=Number(el("m_loc").value), qty=Number(el("m_qty").value);
  if(!loc){ toast("Alege locația",true); return; }
  if(!(qty>0)){ toast("Cantitate invalidă",true); return; }
  var path = mv.kind==="receive" ? "/api/inventory/receive" : "/api/inventory/ship";
  api("POST",path,{product_id:mv.product.id, location_id:loc, quantity:qty}).then(function(){
    feedback(true);
    toast((mv.kind==="receive"?"Recepționat: ":"Expediat: ")+qty+" × "+mv.product.name);
    screenMove(mv.kind); // reset pentru următorul scan
  }).catch(function(e){ feedback(false); toast(e.message,true); });
}

/* ---- Transfer ---- */
function screenTransfer(){
  window._tr={product:null};
  scanTarget=function(code){ trScan(code); };
  shell("Transfer între locații",
    '<div class="scanbox"><input id="t_scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează produsul (fără Enter)"></div>'
    +'<button class="cam" onclick="openCam(function(c){el(\'t_scan\').value=c;trScan(c)})">📷 Scanează cu camera</button>'
    +'<div id="t_prod"></div>'
    +'<div id="t_form" style="display:none">'
    +'<label>Din locația</label><select id="t_from">'+locOptions()+'</select>'
    +'<label>În locația</label><select id="t_to">'+locOptions()+'</select>'
    +'<label>Cantitate</label><input id="t_qty" type="number" inputmode="numeric" min="1" value="1">'
    +'<button class="big" onclick="trSubmit()">Confirmă transferul</button>'
    +'</div>', {back:"renderHome()"});
  wireScan("t_scan", trScan);
}
function trScan(code){
  code=(code||"").trim(); if(!code) return;
  resolveProduct(code).then(function(p){
    if(!p){ feedback(false); el("t_prod").innerHTML='<div class="card center muted">Produs negăsit: '+esc(code)+'</div>'; el("t_form").style.display="none"; return; }
    feedback(true);
    window._tr.product=p;
    el("t_prod").innerHTML='<div class="card"><div style="font-size:17px;font-weight:800">'+esc(p.name)+'</div></div>';
    el("t_form").style.display="block";
  }).catch(function(e){ toast(e.message,true); });
}
function trSubmit(){
  var tr=window._tr; if(!tr||!tr.product){ toast("Scanează întâi un produs",true); return; }
  var from=Number(el("t_from").value), to=Number(el("t_to").value), qty=Number(el("t_qty").value);
  if(!from||!to){ toast("Alege locațiile",true); return; }
  if(from===to){ toast("Locațiile trebuie să difere",true); return; }
  if(!(qty>0)){ toast("Cantitate invalidă",true); return; }
  api("POST","/api/inventory/transfer",{product_id:tr.product.id, from_location_id:from, to_location_id:to, quantity:qty}).then(function(){
    feedback(true); toast("Transferat: "+qty+" × "+tr.product.name); screenTransfer();
  }).catch(function(e){ feedback(false); toast(e.message,true); });
}

/* ---- Inventar (numărare fizică pe locație) ---- */
function screenInventory(){
  scanTarget=null;
  shell("Inventar — alege locația",
    '<div class="card"><label>Locație de numărat</label><select id="iv_loc">'+locOptions()+'</select>'
    +'<div class="muted" style="font-size:12.5px;margin:8px 0">Poți și scana codul locației (dacă are etichetă).</div>'
    +'<div class="scanbox" style="margin-bottom:8px"><input id="iv_locscan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează codul locației (opțional)"></div>'
    +'<button class="big" onclick="invStart()">Începe inventarul</button></div>', {back:"renderHome()"});
  wireScan("iv_locscan", function(code){
    var m=LOCS.filter(function(l){ return String(l.code)===String(code); })[0];
    if(m){ el("iv_loc").value=m.id; feedback(true); toast("Locație: "+m.code); }
    else { feedback(false); toast("Locație negăsită: "+code,true); }
  });
}
window.invStart=function(){
  var loc=Number(el("iv_loc").value);
  if(!loc){ toast("Alege locația",true); return; }
  var lc=(LOCS.filter(function(l){return l.id===loc;})[0]||{}).code||("#"+loc);
  window._inv={ locId:loc, locCode:lc, sys:{}, counted:{} };
  shell("Inventar · "+esc(lc),
    '<div class="scanbox"><input id="iv_scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează produsele (fără Enter)"></div>'
    +'<button class="cam" onclick="openCam(function(c){invScan(c)})">📷 Scanează cu camera</button>'
    +'<div id="iv_sum" class="muted" style="margin:10px 0;font-size:12.5px">Se încarcă stocul locației…</div>'
    +'<div id="iv_list"></div>'
    +'<button class="big" style="margin-top:14px" onclick="invFinish()">Finalizează inventarul</button>', {back:"screenInventory()"});
  scanTarget=function(code){ invScan(code); };
  // Încarcă stocul din sistem pentru locația aleasă
  api("GET","/api/inventory/stock").then(function(d){
    (d.stock||[]).forEach(function(s){ if(Number(s.location_id)===loc) window._inv.sys[s.product_id]={qty:Number(s.quantity)||0, name:s.product_name, sku:s.sku, unit:s.unit}; });
    invRender();
  }).catch(function(){ invRender(); });
  wireScan("iv_scan", invScan);
};
function invScan(code){
  code=(code||"").trim(); if(!code) return;
  resolveProduct(code).then(function(p){
    if(!p){ feedback(false); toast("Produs negăsit: "+code,true); return; }
    feedback(true);
    var inv=window._inv; if(!inv) return;
    var c=inv.counted[p.id]||{qty:0, name:p.name, sku:p.barcode||p.sku, unit:p.unit};
    c.qty+=1; inv.counted[p.id]=c;
    invRender();
  }).catch(function(e){ toast(e.message,true); });
}
window.invSetCount=function(pid, val){
  var inv=window._inv; if(!inv||!inv.counted[pid]) return;
  var n=Math.max(0, Math.round(Number(val)||0)); inv.counted[pid].qty=n; invRender();
};
function invRender(){
  var inv=window._inv; if(!inv) return;
  var ids=Object.keys(inv.counted);
  var diffs=0;
  var rows=ids.map(function(pid){
    var c=inv.counted[pid]; var sysQ=(inv.sys[pid]&&inv.sys[pid].qty)||0; var d=c.qty-sysQ;
    if(d!==0) diffs++;
    var badge = d===0 ? '<span class="pill good">OK</span>' : (d>0?'<span class="pill" style="background:#14352a;color:#4ade80">+'+d+'</span>':'<span class="pill bad">'+d+'</span>');
    return '<div class="card" style="margin-bottom:8px"><div style="font-weight:800">'+esc(c.name)+'</div>'
      +'<div class="muted" style="font-size:12px;margin-bottom:6px">'+esc(c.sku||"")+'</div>'
      +'<div class="row" style="align-items:center;gap:10px">'
      +'<div>Numărat <input type="number" inputmode="numeric" min="0" value="'+c.qty+'" style="width:80px" onchange="invSetCount('+pid+',this.value)"></div>'
      +'<div class="muted">sistem: '+sysQ+' '+esc(c.unit||"")+'</div>'+badge+'</div></div>';
  }).join("");
  var s=el("iv_sum"); if(s) s.innerHTML='Scanate: <b>'+ids.length+'</b> · diferențe: <b>'+diffs+'</b>';
  var L=el("iv_list"); if(L) L.innerHTML = rows || '<div class="card center muted">Scanează primul produs.</div>';
}
window.invFinish=function(){
  var inv=window._inv; if(!inv){ return; }
  var ids=Object.keys(inv.counted);
  if(!ids.length){ toast("Nu ai scanat niciun produs",true); return; }
  var ops=[];
  ids.forEach(function(pid){
    var c=inv.counted[pid]; var sysQ=(inv.sys[pid]&&inv.sys[pid].qty)||0; var d=c.qty-sysQ;
    if(d!==0) ops.push({product_id:Number(pid), delta:d});
  });
  if(!ops.length){ toast("Nicio diferență — stocul e corect ✓"); feedback(true); renderHome(); return; }
  if(!confirm("Aplici "+ops.length+" ajustări de stoc în locația "+inv.locCode+"?")) return;
  var done=0, fail=0, seq=Promise.resolve();
  ops.forEach(function(o){ seq=seq.then(function(){
    return api("POST","/api/inventory/adjust",{product_id:o.product_id, location_id:inv.locId, delta:o.delta, reference:"INVENTAR", note:"inventar "+inv.locCode})
      .then(function(){done++;}).catch(function(){fail++;});
  }); });
  seq.then(function(){ feedback(true); toast("Inventar aplicat: "+done+" ajustări"+(fail?(" · "+fail+" eșuate"):"")); renderHome(); });
};

/* ---- Comenzi de pregătit (picking scanat) ---- */
function ordStatus(s){ if(s==="completed")return '<span class="pill good">expediată</span>'; if(s==="cancelled")return '<span class="pill bad">anulată</span>'; return '<span class="pill" style="background:#3a3f1a;color:#f0c651">de pregătit</span>'; }
function screenOrders(){
  scanTarget=null;
  shell("Comenzi de pregătit",'<div id="ord_list" class="muted center" style="padding:20px">Se încarcă…</div>',{back:"renderHome()"});
  api("GET","/api/orders?type=outbound").then(function(d){
    var list=(d.orders||[]).filter(function(o){ return o.status!=="completed" && o.status!=="cancelled"; });
    if(!list.length){ el("ord_list").innerHTML='<div class="card center muted">Nicio comandă de pregătit.</div>'; return; }
    el("ord_list").innerHTML=list.map(function(o){
      var who = o.source==="portal" ? (esc(o.client_name||"client")+(o.recipient_name?(' → '+esc(o.recipient_name)):'')) : esc(o.partner_name||"—");
      return '<div class="card" onclick="screenPick('+o.id+')" style="margin-bottom:10px;cursor:pointer">'
        +'<div class="row" style="justify-content:space-between;align-items:center"><b>'+esc(o.code)+'</b>'+ordStatus(o.status)+'</div>'
        +'<div class="muted" style="font-size:13px;margin-top:4px">'+who+'</div>'
        +'<div class="muted" style="font-size:12.5px;margin-top:2px">'+esc(o.line_count)+' produse · '+esc(o.total_qty)+' buc.</div></div>';
    }).join("");
  }).catch(function(e){ el("ord_list").innerHTML='<div class="card center" style="color:#f88">'+esc(e.message)+'</div>'; });
}
var _pick=null;
window.screenPick=function(id){
  api("GET","/api/orders/"+id).then(function(d){
    _pick={ id:id, order:d.order, lines:(d.lines||[]).map(function(l){ return {product_id:l.product_id, sku:l.sku, name:l.product_name, unit:l.unit, need:Number(l.quantity), done:0}; }) };
    scanTarget=function(code){ pickScan(code); };
    var recip = d.order.source==="portal" ? ('<div class="muted" style="font-size:13px;margin-bottom:8px">Livrare: <b>'+esc(d.order.recipient_name||"—")+'</b>'+(d.order.recipient_address?(', '+esc(d.order.recipient_address)):'')+(d.order.recipient_city?(', '+esc(d.order.recipient_city)):'')+'</div>') : '';
    shell("Picking "+esc(d.order.code),
      recip
      +'<div class="scanbox"><input id="pk_scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scanează produsul de cules"></div>'
      +'<button class="cam" onclick="openCam(function(c){pickScan(c)})">📷 Scanează cu camera</button>'
      +'<div id="pk_lines" style="margin-top:12px"></div>'
      +'<div id="pk_services" style="margin-top:14px"></div>'
      +'<div id="pk_done" style="margin-top:14px"></div>'
    , {back:"screenOrders()"});
    pickRender(); wireScan("pk_scan", pickScan); pkLoadServices(id);
  }).catch(function(e){ toast(e.message,true); });
};
window.pkLoadServices=function(id){
  if(!el("pk_services")) return;
  Promise.all([ api("GET","/api/orders/"+id+"/services"), api("GET","/api/services") ]).then(function(r){
    var list=r[0].services||[], total=r[0].total||0, cat=r[1].services||[];
    var rows=list.map(function(s){
      return '<div class="row" style="justify-content:space-between;align-items:center;padding:4px 0;border-top:1px solid #1b2540">'
        +'<span>'+esc(s.name)+' × '+(Number(s.quantity)||0)+'</span>'
        +'<span>'+((Number(s.price)||0)*(Number(s.quantity)||0)).toFixed(2)+' <button style="padding:2px 8px;margin-left:6px;background:#7f1d1d" onclick="pkRemoveService('+id+','+s.id+')">✕</button></span></div>';
    }).join("");
    var opts=cat.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+' ('+(Number(c.price)||0).toFixed(2)+' lei)</option>'; }).join("");
    el("pk_services").innerHTML='<div class="card"><b>Servicii'+(total?(' · '+total.toFixed(2)+' lei'):'')+'</b>'
      +(rows||'<div class="muted" style="font-size:12.5px;margin:6px 0">Niciun serviciu adăugat.</div>')
      +(cat.length
        ? '<div class="row" style="gap:6px;margin-top:8px;align-items:center"><select id="pk_sv" style="flex:1">'+opts+'</select><input id="pk_svqty" type="number" inputmode="numeric" min="1" value="1" style="width:64px"><button onclick="pkAddService('+id+')">+</button></div>'
        : '<div class="muted" style="font-size:12px;margin-top:6px">Niciun serviciu definit (adaugă-le în admin → Servicii).</div>')
      +'</div>';
  }).catch(function(){});
};
window.pkAddService=function(id){
  var sid=el("pk_sv")?Number(el("pk_sv").value):0, qty=el("pk_svqty")?Number(el("pk_svqty").value):1;
  if(!sid){ toast("Alege un serviciu",true); return; }
  api("POST","/api/orders/"+id+"/services",{service_id:sid, quantity:qty}).then(function(){ feedback(true); toast("Serviciu adăugat"); pkLoadServices(id); }).catch(function(e){ toast(e.message,true); });
};
window.pkRemoveService=function(id, lineId){
  api("DELETE","/api/orders/"+id+"/services/"+lineId).then(function(){ pkLoadServices(id); }).catch(function(e){ toast(e.message,true); });
};
function pickRender(){
  var all=true;
  var rows=_pick.lines.map(function(l){
    var ok=l.done>=l.need; if(!ok) all=false;
    return '<div class="card" style="margin-bottom:8px;border-left:4px solid '+(ok?"#22c55e":"#f0c651")+'">'
      +'<div class="row" style="justify-content:space-between;align-items:center">'
      +'<div><b>'+esc(l.name)+'</b><div class="muted" style="font-size:12px">'+esc(l.sku||"")+'</div></div>'
      +'<div style="text-align:right"><b style="font-size:20px;color:'+(ok?"#22c55e":"#eef2fb")+'">'+l.done+'</b><span class="muted"> / '+l.need+' '+esc(l.unit||"")+'</span></div>'
      +'</div></div>';
  }).join("");
  el("pk_lines").innerHTML=rows;
  var host=el("pk_done"); if(!host) return;
  if(all){
    host.innerHTML='<div class="card center" style="background:rgba(34,197,94,.12);margin-bottom:12px"><b>Tot culese ✓</b></div>'
      +'<label>Expediază din locația</label><select id="pk_loc">'+locOptions()+'</select>'
      +'<button class="big" onclick="completePick()">Finalizează &amp; expediază</button>';
  } else { host.innerHTML=''; }
}
function pickScan(code){
  code=(code||"").trim(); if(!code||!_pick) return;
  resolveProduct(code).then(function(p){
    if(!p){ feedback(false); toast("Produs negăsit",true); return; }
    var line=_pick.lines.find(function(l){ return l.product_id===p.id; });
    if(!line){ feedback(false); toast("Nu e în această comandă: "+p.name,true); return; }
    if(line.done>=line.need){ feedback(false); toast("Deja complet: "+line.name,true); return; }
    line.done++; feedback(true);
    if(line.done>=line.need) toast("✓ "+line.name+" complet"); else toast(line.name+": "+line.done+"/"+line.need);
    pickRender();
  }).catch(function(e){ feedback(false); toast(e.message,true); });
}
window.completePick=function(){
  if(!_pick) return;
  var loc=el("pk_loc")?Number(el("pk_loc").value):0;
  if(!loc){ toast("Alege locația de expediere",true); return; }
  api("POST","/api/orders/"+_pick.id+"/complete",{location_id:loc}).then(function(){
    feedback(true); toast("Comandă expediată ✓"); _pick=null; screenOrders();
  }).catch(function(e){ feedback(false); toast(e.message,true); });
};

/* ---- Comun ---- */
function locOptions(){ return '<option value="">— alege —</option>'+LOCS.map(function(l){return '<option value="'+l.id+'">'+esc(l.code)+'</option>';}).join(""); }
function resolveProduct(code){
  return api("GET","/api/products?q="+encodeURIComponent(code)).then(function(d){
    var list=d.products||[];
    var exact=list.filter(function(p){ return p.barcode===code || p.sku===code; });
    return (exact[0]||list[0]||null);
  });
}
/* Leagă un câmp de scanare: declanșează AUTOMAT după rafala de scanare (fără Enter),
   dar acceptă și Enter. Dedupe ca să nu tragă de două ori. */
function wireScan(id, fn){
  var inp=el(id); if(!inp) return;
  var timer=null, lastFired="", lastFiredT=0;
  function fire(){
    var v=inp.value.trim(); if(!v || v.length<2) return;
    var now=Date.now();
    if(v===lastFired && now-lastFiredT<600) return; // evită dublarea (rafală + Enter)
    lastFired=v; lastFiredT=now; inp.value=""; fn(v);
  }
  // Enter (dacă DataWedge îl trimite) → declanșează imediat
  inp.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.keyCode===13){ e.preventDefault(); if(timer) clearTimeout(timer); fire(); } });
  // Fără Enter: câmp dedicat scanării → declanșează după o scurtă pauză, indiferent de viteză
  inp.addEventListener("input", function(){
    if(timer) clearTimeout(timer);
    timer=setTimeout(fire, 140);
  });
  setTimeout(function(){ inp.focus(); }, 120);
}

/* ====== Scanner laser Zebra (DataWedge) — captură globală, FĂRĂ Enter ====== */
/* Când niciun câmp nu e focusat, prindem rafala de la scaner și o trimitem la ecranul curent.
   Se declanșează la pauza de după scanare (nu e nevoie de Enter); Enter tot merge. */
(function(){
  var buf="", last=0, timer=null;
  function flush(){ var c=buf.trim(); buf=""; if(c.length>=2 && scanTarget) scanTarget(c); }
  document.addEventListener("keydown",function(e){
    var a=document.activeElement;
    var inField=a && (a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA");
    if(inField) return; // câmpul focusat are propriul wireScan
    var now=Date.now(); if(now-last>120) buf=""; last=now;
    if(timer) clearTimeout(timer);
    if(e.key==="Enter"){ flush(); return; }
    if(e.key && e.key.length===1){ buf+=e.key; timer=setTimeout(flush,110); }
  },true);
})();

/* ====== Cameră (ZXing încărcat de pe server) ====== */
var _zx=null, _stream=null, _camCb=null;
function ensureZX(){ if(window.ZXing) return Promise.resolve(); return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=API+"/vendor/zxing.js"; s.onload=res; s.onerror=function(){rej(new Error("Nu pot încărca scanner-ul camerei (offline?)"));}; document.head.appendChild(s); }); }
function openCam(cb){
  _camCb=cb;
  ensureZX().then(function(){
    el("cam").style.display="flex";
    _zx=new ZXing.BrowserMultiFormatReader();
    return _zx.decodeFromVideoDevice(null, "camvid", function(result,err){
      if(result){ var t=result.getText(); closeCam(); if(_camCb) _camCb(t); }
    });
  }).catch(function(e){ toast(e.message,true); });
}
function closeCam(){ try{ if(_zx) _zx.reset(); }catch(e){} el("cam").style.display="none"; }

/* ====== Boot ====== */
if(token){
  api("GET","/api/auth/me").then(function(d){ me=d.user; if(me.kind==="client"){ logout(); return; } loadLocs(); renderHome(); startOrdPoll(); })
    .catch(function(){ logout(); });
} else { renderLogin(); }
