name = "wms"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Baza de date D1 (SQLite pe edge).
# După ce creezi baza cu `wrangler d1 create wms-db`, copiază database_id-ul aici.
[[d1_databases]]
binding = "DB"
database_name = "wms-db"
database_id = "547695ef-25a7-410e-b256-354650edd00f"

[observability]
enabled = true

# Permite importul fișierelor .txt din src/vendor ca string (ex: biblioteca ZXing)
[[rules]]
type = "Text"
globs = ["**/vendor/*.txt"]
fallthrough = true

# Imagini vendorizate importate ca binar (ex: fundal login)
[[rules]]
type = "Data"
globs = ["**/vendor/*.png"]
fallthrough = true

# JWT_SECRET se setează ca secret, NU aici:
#   wrangler secret put JWT_SECRET
# Pentru dev local există un fallback în cod.
